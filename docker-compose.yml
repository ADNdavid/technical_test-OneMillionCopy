
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onemillioncopy_app
    ports:
      - '8000:8000'
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: examplePassword
      MYSQL_DB_NAME: leads_db
      OPENAI_API_KEY: exampleOpenAIKey 

  db:
    image: mysql:8.4.9
    container_name: onemillioncopy_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: examplePassword
      MYSQL_DATABASE: leads_db
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
    name: onemillioncopy_db_data
